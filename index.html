<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>员工打卡系统</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #1d4ed8);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 420px;
      max-width: 100%;
      background: white;
      padding: 35px;
      border-radius: 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,.3);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      color: white;
      background: #2563eb;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    .register {
      background: #16a34a;
    }

    .forgot {
      background: #6b7280;
    }

    #message {
      text-align: center;
      min-height: 24px;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>🕒 员工打卡系统</h1>

  <div class="subtitle">
    注册账号后即可登录和保存自己的打卡记录
  </div>

  <input
    id="email"
    type="email"
    placeholder="邮箱，例如 name@gmail.com">

  <input
    id="password"
    type="password"
    placeholder="密码">

  <button id="loginBtn">
    登录
  </button>

  <button
    id="registerBtn"
    class="register">
    注册账号
  </button>

  <button
    id="forgotBtn"
    class="forgot">
    忘记密码
  </button>

  <div id="message"></div>

</div>


<script type="module">

  import { auth } from "./firebase-config.js";

  import {
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


  const emailInput =
    document.getElementById("email");

  const passwordInput =
    document.getElementById("password");

  const message =
    document.getElementById("message");


  function showMessage(text, ok = false) {
    message.textContent = text;
    message.style.color =
      ok ? "#16a34a" : "#dc2626";
  }


  document.getElementById("registerBtn")
    .addEventListener("click", async () => {

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;

      if (!email || !password) {
        showMessage("请输入邮箱和密码");
        return;
      }

      try {

        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );

        showMessage(
          "注册成功，正在进入系统...",
          true
        );

        setTimeout(() => {
          window.location.href = "app.html";
        }, 800);

      } catch (error) {

        if (
          error.code ===
          "auth/email-already-in-use"
        ) {
          showMessage("这个邮箱已经注册过");
        }

        else if (
          error.code ===
          "auth/weak-password"
        ) {
          showMessage("密码太简单");
        }

        else if (
          error.code ===
          "auth/invalid-email"
        ) {
          showMessage("邮箱格式不正确");
        }

        else {
          showMessage(
            "注册失败：" + error.message
          );
        }

      }

    });


  document.getElementById("loginBtn")
    .addEventListener("click", async () => {

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;

      if (!email || !password) {
        showMessage("请输入邮箱和密码");
        return;
      }

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        window.location.href =
          "app.html";

      } catch (error) {

        showMessage(
          "登录失败，请检查邮箱或密码"
        );

      }

    });


  document.getElementById("forgotBtn")
    .addEventListener("click", async () => {

      const email =
        emailInput.value.trim();

      if (!email) {
        showMessage("请先填写你的邮箱");
        return;
      }

      try {

        await sendPasswordResetEmail(
          auth,
          email
        );

        showMessage(
          "重置密码邮件已发送，请检查邮箱",
          true
        );

      } catch (error) {

        showMessage(
          "发送失败，请检查邮箱"
        );

      }

    });


  onAuthStateChanged(
    auth,
    (user) => {

      if (user) {
        window.location.href =
          "app.html";
      }

    }
  );

</script>

</body>
</html>
