<!DOCTYPE html>
<html lang="zh-CN">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>员工打卡系统</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        Arial,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #111827,
          #2563eb
        );

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;

    }


    .box {

      width: 460px;

      max-width: 100%;

      background: white;

      border-radius: 24px;

      padding: 30px;

      box-shadow:
        0 20px 60px
        rgba(0,0,0,.3);

    }


    h1 {

      text-align: center;

      margin-top: 0;

      margin-bottom: 10px;

    }


    .subtitle {

      text-align: center;

      color: #666;

      margin-bottom: 25px;

    }


    #loading {

      text-align: center;

      padding: 25px;

      color: #666;

    }


    #error {

      display: none;

      padding: 12px;

      margin-bottom: 15px;

      border-radius: 10px;

      background: #fee2e2;

      color: #dc2626;

      font-size: 14px;

    }


    #clerk-sign-in {

      display: flex;

      justify-content: center;

      width: 100%;

    }

  </style>


  <!--
    ↓↓↓ 把这里换成 Clerk API Keys 页面
    Quick copy 给你的 Clerk JS 地址
  -->


<script
  defer
  crossorigin="anonymous"
  src="https://modern-bass-6049.clerk.accounts.dev/npm/@clerk/ui@1/dist/ui.browser.js"
  type="text/javascript">
</script>

<script
  defer
  crossorigin="anonymous"
  data-clerk-publishable-key="pk_test_bW9kZXJuLWJhc3MtNjA0OS5jbGVyay5hY2NvdW50cy5kZXYk"
  src="https://modern-bass-6049.clerk.accounts.dev/npm/@clerk/clerk-js@6/dist/clerk.browser.js"
  type="text/javascript">
</script>


</head>


<body>


<div class="box">


  <h1>
    🕒 员工打卡系统
  </h1>


  <div class="subtitle">

    注册或登录后进入个人打卡页面

  </div>


  <div id="error"></div>


  <div id="loading">

    正在加载登录系统...

  </div>


  <div id="clerk-sign-in"></div>


</div>



<script>

window.addEventListener(
  "load",

  async () => {


    const loading =
      document.getElementById(
        "loading"
      );


    const errorBox =
      document.getElementById(
        "error"
      );


    try {


      /*
       * 检查 Clerk
       */

      if (!window.Clerk) {

        throw new Error(
          "Clerk JS 没有成功加载"
        );

      }


      /*
       * 初始化
       */

     await window.Clerk.load({
  ui: {
    ClerkUI: window.__internal_ClerkUICtor
  }
});


      console.log(
        "Clerk 初始化成功"
      );


      /*
       * 已经登录
       */

      if (window.Clerk.user) {


        window.location.href =
          "./app.html";


        return;

      }


      /*
       * 隐藏 loading
       */

      loading.style.display =
        "none";


      /*
       * 显示登录界面
       */

      const signIn =
        document.getElementById(
          "clerk-sign-in"
        );


      window.Clerk.mountSignIn(

        signIn,

        {

          forceRedirectUrl:
            "./app.html",

          signUpForceRedirectUrl:
            "./app.html"

        }

      );


    }


    catch (error) {


      console.error(
        error
      );


      loading.style.display =
        "none";


      errorBox.style.display =
        "block";


      errorBox.textContent =
        "登录系统加载失败：" +
        error.message;


    }

  }

);

</script>


</body>

</html>
