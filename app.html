<body>


<div class="box">

  <h1>
    🕒 员工打卡系统
  </h1>

  <div class="subtitle">
    员工个人打卡页面
  </div>

  <div id="error"></div>

  <div id="loading">
    正在检查登录状态...
  </div>


  <div id="content">

    <div class="user">

      <strong>
        当前登录员工
      </strong>

      <p>
        邮箱：
        <span id="email">
          加载中...
        </span>
      </p>

    </div>


    <div class="buttons">

      <button id="clockIn">
        🟢 上班打卡
      </button>

      <button id="clockOut">
        🔵 下班打卡
      </button>

    </div>


    <div id="message"></div>


    <div class="time">

      当前时间：

      <strong id="currentTime"></strong>

    </div>


    <button id="logout">
      退出登录
    </button>

  </div>

</div>



<script type="module">

import { db } from "./firebase-config.js";

import {
  addDoc,
  collection,
  serverTimestamp,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


window.addEventListener(
  "load",

  async () => {


    const loading =
      document.getElementById(
        "loading"
      );


    const content =
      document.getElementById(
        "content"
      );


    const errorBox =
      document.getElementById(
        "error"
      );


    const message =
      document.getElementById(
        "message"
      );


    const clockInButton =
      document.getElementById(
        "clockIn"
      );


    const clockOutButton =
      document.getElementById(
        "clockOut"
      );


    try {


      /*
       =========================
       检查 Clerk
       =========================
      */

      if (!window.Clerk) {

        throw new Error(
          "Clerk 没有成功加载"
        );

      }


      /*
       =========================
       初始化 Clerk
       =========================
      */

      await window.Clerk.load({
        ui: {
          ClerkUI:
            window.__internal_ClerkUICtor
        }
      });


      /*
       =========================
       检查登录状态
       =========================
      */

      if (!window.Clerk.user) {

        window.location.href =
          "./index.html";

        return;

      }


      /*
       =========================
       当前登录用户
       =========================
      */

      const user =
        window.Clerk.user;


      const email =
        user.primaryEmailAddress
          ?.emailAddress
        ||
        "没有邮箱";


      document.getElementById(
        "email"
      ).textContent =
        email;


      loading.style.display =
        "none";


      content.style.display =
        "block";


      /*
       =========================
       当前时间
       =========================
      */

      function updateTime() {

        const now =
          new Date();


        document.getElementById(
          "currentTime"
        ).textContent =

          now.toLocaleString(
            "zh-CN"
          );

      }


      updateTime();


      setInterval(
        updateTime,
        1000
      );


      /*
       =========================
       获取今天日期
       =========================
      */

      function getToday() {

        return new Date()
          .toLocaleDateString(
            "zh-CN"
          );

      }


      /*
       =========================
       读取今天打卡记录
       =========================
      */

      async function loadTodayRecords() {


        const today =
          getToday();


        const q =
          query(

            collection(
              db,
              "clockRecords"
            ),

            where(
              "clerkUserId",
              "==",
              user.id
            ),

            where(
              "date",
              "==",
              today
            )

          );


        const snapshot =
          await getDocs(q);


        if (
          snapshot.empty
        ) {

          message.style.display =
            "none";

          return;

        }


        const records =
          [];


        snapshot.forEach(
          (documentSnapshot) => {


            const data =
              documentSnapshot.data();


            records.push(
              data
            );

          }
        );


        records.sort(
          (a, b) => {

            const aTime =
              a.clientTimestamp || 0;

            const bTime =
              b.clientTimestamp || 0;

            return (
              aTime - bTime
            );

          }
        );


        let html =

          "<strong>今天的打卡记录：</strong><br><br>";


        records.forEach(
          (data) => {


            const label =

              data.type ===
              "clock-in"

                ? "🟢 上班"

                : "🔵 下班";


            html +=

              label +
              "：" +
              data.localTime +
              "<br>";

          }
        );


        message.style.display =
          "block";


        message.innerHTML =
          html;

      }


      /*
       =========================
       保存打卡记录
       =========================
      */

      async function saveClock(
        type
      ) {


        const button =

          type ===
          "clock-in"

            ? clockInButton

            : clockOutButton;


        try {


          button.disabled =
            true;


          message.style.display =
            "block";


          message.textContent =
            "正在保存打卡记录...";


          const now =
            new Date();


          await addDoc(

            collection(
              db,
              "clockRecords"
            ),

            {

              clerkUserId:
                user.id,

              email:
                email,

              type:
                type,

              localTime:
                now.toLocaleString(
                  "zh-CN"
                ),

              date:
                getToday(),

              clientTimestamp:
                now.getTime(),

              createdAt:
                serverTimestamp()

            }

          );


          message.style.display =
            "block";


          message.innerHTML =

            type ===
            "clock-in"

              ? "✅ 上班打卡成功！"

              : "✅ 下班打卡成功！";


          await loadTodayRecords();


        }

        catch (error) {


          console.error(
            error
          );


          message.style.display =
            "block";


          message.textContent =

            "❌ 打卡失败：" +
            error.message;


        }

        finally {


          button.disabled =
            false;


        }

      }


      /*
       =========================
       上班打卡
       =========================
      */

      clockInButton.addEventListener(

        "click",

        async () => {


          await saveClock(
            "clock-in"
          );


        }

      );


      /*
       =========================
       下班打卡
       =========================
      */

      clockOutButton.addEventListener(

        "click",

        async () => {


          await saveClock(
            "clock-out"
          );


        }

      );


      /*
       =========================
       退出登录
       =========================
      */

      document.getElementById(
        "logout"
      ).addEventListener(

        "click",

        async () => {


          await window.Clerk.signOut();


          window.location.href =
            "./index.html";


        }

      );


      /*
       =========================
       页面打开时读取记录
       =========================
      */

      await loadTodayRecords();


    }


    catch (error) {


      console.error(
        error
      );


      loading.style.display =
        "none";


      errorBox.style.display =
        "block";


      errorBox.textContent =

        "页面加载失败：" +
        error.message;


    }


  }

);

</script>


</body>

</html>
