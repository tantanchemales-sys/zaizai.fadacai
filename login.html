<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>员工登录 | zaizaifadacai</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #2563eb);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 420px;
      max-width: 100%;
      background: rgba(255,255,255,0.97);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 15px;
    }

    p {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    #loading {
      text-align: center;
      padding: 20px;
      color: #555;
    }

    #error {
      display: none;
      color: #dc2626;
      background: #fee2e2;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 14px;
      word-break: break-word;
    }

    #clerk-sign-in {
      display: flex;
      justify-content: center;
      width: 100%;
    }
  </style>


  <!-- Clerk UI -->
  <script
    defer
    crossorigin="anonymous"
    src="https://clerk.tantanchemales-sys.github.io/npm/@clerk/ui@1/dist/ui.browser.js"
    type="text/javascript">
  </script>


  <!-- Clerk JS -->
  <script
    defer
    crossorigin="anonymous"
    data-clerk-publishable-key="pk_live_Y2xlcmsudGFudGFuY2hlbWFsZXMtc3lzLmdpdGh1Yi5pbyQ"
    src="https://clerk.tantanchemales-sys.github.io/npm/@clerk/clerk-js@6/dist/clerk.browser.js"
    type="text/javascript">
  </script>

</head>

<body>

  <div class="box">

    <h1>🕒 员工打卡系统</h1>

    <p>
      注册或登录后进入个人打卡页面
    </p>

    <div id="error"></div>

    <div id="loading">
      正在加载登录系统...
    </div>

    <div id="clerk-sign-in"></div>

  </div>


<script>

  window.addEventListener("load", async function () {

    const loading =
      document.getElementById("loading");

    const errorBox =
      document.getElementById("error");

    try {

      /*
        检查 Clerk 是否成功加载
      */
      if (!window.Clerk) {
        throw new Error(
          "Clerk 加载失败，请检查 Publishable Key 或 Clerk 域名配置。"
        );
      }


      /*
        初始化 Clerk
      */
      await window.Clerk.load();

      console.log(
        "Clerk 初始化成功",
        window.Clerk
      );


      loading.style.display =
        "none";


      /*
        如果已经登录
      */
      if (window.Clerk.user) {

        console.log(
          "用户已经登录：",
          window.Clerk.user.id
        );

        window.location.href =
          "./clock.html";

        return;
      }


      /*
        显示 Clerk 登录界面
      */
      const signInDiv =
        document.getElementById(
          "clerk-sign-in"
        );


      window.Clerk.mountSignIn(
        signInDiv,
        {

          /*
            用户点击注册时，
            Clerk 自己处理注册流程
          */
          signUpUrl:
            window.location.href,


          /*
            登录成功后
          */
          forceRedirectUrl:
            "./clock.html",


          /*
            注册成功后
          */
          signUpForceRedirectUrl:
            "./clock.html"

        }
      );

    }

    catch (error) {

      console.error(
        "Clerk 错误：",
        error
      );

      loading.style.display =
        "none";

      errorBox.style.display =
        "block";

      errorBox.innerHTML =
        "登录系统加载失败：<br>" +
        error.message;

    }

  });

</script>

</body>
</html>
